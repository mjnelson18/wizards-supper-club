name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:
  repository_dispatch:
    types: [sheet-updated]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Any failure from here on stops the job before the deploy, so the
      # previous deployment stays live.
      - name: Fetch, whitelist and validate the Sheet data
        run: npm run data
        env:
          EVENINGS_CSV_URL: ${{ vars.EVENINGS_CSV_URL }}
          SCORES_CSV_URL: ${{ vars.SCORES_CSV_URL }}
          STATUS_CSV_URL: ${{ vars.STATUS_CSV_URL }}

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Privacy scan of the built site
        run: npm run check:dist

      - name: Smoke test at 360 px
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
